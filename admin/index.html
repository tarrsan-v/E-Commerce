<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopEase Admin</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--ac:#4f46e5;--bd:#e5e7eb;--er:#dc2626;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#e8eaf0;--mu:#9aa1b2;--bd:#2c3040}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#e8eaf0;--mu:#9aa1b2;--bd:#2c3040}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
header h1{font-size:20px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.del{background:var(--er)}button.on{background:var(--ac);color:#fff}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>button{flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
.p{text-align:center}.p .e{font-size:44px}.p b{display:block}.mu{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
.tw{overflow-x:auto}
.hero{text-align:center;padding:60px 16px}.hero h2{font-size:34px;margin:8px 0}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .card{max-width:380px;width:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:10;max-width:90%}
.otp{background:var(--bg);border:1px dashed var(--ac);border-radius:8px;padding:10px;margin:10px 0;text-align:center}
.otp b{font-size:24px;letter-spacing:4px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"><div class="card" id="mbox"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let cr=null,P=[],edit=null;try{cr=JSON.parse(ls('se_adm'))}catch(e){}
const call=async(a,d={})=>{try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,...cr,...d})});return await r.json()}catch(e){return{error:'Network error'}}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
async function adminLogin(){
 cr={email:$('#ae').value.trim(),password:$('#ax').value};
 const r=await call('adminLogin');
 if(r.error){cr=null;return toast(r.error)}
 ls('se_adm',JSON.stringify(cr));view()}
function logout(){cr=null;ls('se_adm',null);view()}
async function view(){
 if(!cr){$('#app').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h3 style="margin-top:0">🛠️ Admin Login</h3>
  <label>Email</label><input id="ae" type="email" placeholder="admin email"><label>Password</label><input id="ax" type="password">
  <p><button style="width:100%" onclick="adminLogin()">Login</button></p></div>`;return}
 const r=await call('adminData');
 if(r.error){toast(r.error);return logout()}
 P=r.products;const p=edit?P.find(x=>x.id===edit):null;
 $('#app').innerHTML=`<header><h1>🛠️ Admin Panel</h1><span class="mu">${r.orders} orders · ${r.users} customers</span><button class="sec" onclick="logout()">Logout</button></header>
 <div class="card"><h3 style="margin-top:0">${p?'Modify item':'Add item'}</h3>
 <div class="row"><input id="fn" placeholder="Name" value="${esc(p?.name)}"><input id="fc" placeholder="Category" value="${esc(p?.cat)}"></div>
 <div class="row" style="margin-top:8px"><input id="fp" type="number" min="0" placeholder="Price" value="${p?p.price:''}"><input id="fs" type="number" min="0" placeholder="Stock" value="${p?p.stock:''}"><input id="fe" placeholder="Emoji" value="${esc(p?.emoji||'📦')}"></div>
 <p class="row"><button onclick="saveItem()">${p?'Update':'Add'}</button>${p?'<button class="sec" onclick="edit=null;view()">Cancel</button>':''}</p></div>
 <div class="card tw" style="margin-top:12px"><table><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>
 ${P.map(x=>`<tr><td>${esc(x.emoji)}</td><td>${esc(x.name)}</td><td>${esc(x.cat)}</td><td>${inr(x.price)}</td><td>${x.stock}</td>
 <td style="white-space:nowrap"><button class="sec" onclick="edit=${x.id};view();scrollTo(0,0)">Edit</button> <button class="del" onclick="delItem(${x.id})">Delete</button></td></tr>`).join('')}</table></div>`}
async function saveItem(){
 if(!$('#fn').value.trim()||$('#fp').value===''||$('#fs').value==='')return toast('Fill name, price and stock');
 const r=await call('adminSave',{item:{id:edit,name:$('#fn').value.trim(),cat:$('#fc').value.trim(),price:$('#fp').value,stock:$('#fs').value,emoji:$('#fe').value.trim()}});
 if(r.error)return toast(r.error);edit=null;toast('Saved');view()}
async function delItem(id){const r=await call('adminDelete',{id});if(r.error)return toast(r.error);if(edit===id)edit=null;view()}
view();
</script>
</body>
</html>
